<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Syllora</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect for deep links:
      // Redirects 404 path to hash route on the main index.html
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var routePath = l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/');
      var searchAndHash = (routePath ? '#/' + routePath : '#/') + l.search + l.hash;
      l.replace(repoPath + '/' + searchAndHash);
    </script>
  </head>
  <body>
  </body>
</html>
